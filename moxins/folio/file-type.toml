schema = 3
result-type = "text"
perms-request = "dynamic"
permit-async = false
description = """Identify file type using magic bytes. Returns a human-readable \
description (e.g. 'ELF 64-bit executable', 'Bash script, ASCII text')."""
# readguard opens path by a RESOLVE_NO_SYMLINKS descriptor (#490); output is
# mapped back to the name the caller gave.
command = "@READGUARD@"
args = ["exec", "--floor", "@BIN@/folio-perms", "--any-args", "1", "--map-output", "--", "@BIN@/file-type"]
substitute-args = ["path"]
arg-order = ["path"]

[input]
required = ["path"]

[input.properties.path]
type = "string"
description = "Path to the file to identify. Auto-allowed inside CWD, /nix/store, sibling repo checkouts, and Claude-native dirs; prompts elsewhere."

[annotations]
read-only-hint = true
idempotent-hint = true

[resources.path]
op = "read"

[dynamic-perms]
command = "@BIN@/folio-perms"
args = ["read"]
arg-order = ["path"]
timeout-ms = 5000
