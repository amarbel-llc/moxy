schema = 3
perms-request = "dynamic"
description = """Disk usage of a file or directory. Defaults to summary mode (one row per argument) and \
does not cross filesystem boundaries. Returns JSON {path, bytes, human}; pass flags for raw du output."""
# readguard opens path by a RESOLVE_NO_SYMLINKS descriptor (#490): a directory
# is entered and measured as ".", a file arrives as /dev/fd/N; output is mapped
# back to the name the caller gave.
command = "@READGUARD@"
args = ["exec", "--floor", "@BIN@/folio-perms", "--any-args", "1", "--map-output", "--", "@BIN@/du"]
arg-order = ["path", "flags"]

[input]
type = "object"
required = ["path"]

[input.properties.path]
type = "string"
description = "File or directory path. Auto-allowed inside CWD, /nix/store, sibling repo checkouts, and Claude-native dirs; prompts elsewhere."

[input.properties.flags]
type = "string"
description = "Optional flags passed to du (e.g. \"-ah\", \"-c\"). When provided, runs du directly instead of JSON output."

[annotations]
read-only-hint = true
idempotent-hint = true

[resources.path]
op = "read"

[dynamic-perms]
command = "@BIN@/folio-perms"
args = ["read"]
arg-order = ["path"]
timeout-ms = 5000
