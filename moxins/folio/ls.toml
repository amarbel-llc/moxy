schema = 3
perms-request = "dynamic"
permit-async = false
description = """List directory contents with type and size metadata. Returns JSON array of entries \
sorted alphabetically. Each entry has name, type (file/directory/symlink), and size (bytes, files only). \
Pass flags to customize output (e.g. \"-la\" for long format with hidden files)."""
# readguard enters the directory by a RESOLVE_NO_SYMLINKS descriptor (#490)
# and maps the "." the script lists back to the name the caller gave.
command = "@READGUARD@"
args = ["exec", "--floor", "@BIN@/folio-perms", "--any-args", "1", "--map-output", "--", "@BIN@/ls"]
arg-order = ["path", "flags"]

[input]
type = "object"

[input.properties.path]
type = "string"
description = "Directory path to list. Defaults to current working directory. Auto-allowed inside CWD, /nix/store, sibling repo checkouts, and Claude-native dirs; prompts elsewhere."

[input.properties.flags]
type = "string"
description = "Optional flags passed to ls (e.g. \"-la\", \"-lh\"). When provided, runs ls directly instead of JSON output."

[annotations]
read-only-hint = true
idempotent-hint = true

[resources.path]
op = "read"

[dynamic-perms]
command = "@BIN@/folio-perms"
args = ["read"]
arg-order = ["path"]
timeout-ms = 5000
