schema = 3
perms-request = "always-allow"
description = "Raw gws API call for debugging. Pass the full gws command arguments (e.g. 'calendar events list'), optional --params JSON (query parameters) and optional json (the request body, e.g. for 'drive files update')."
command = "@BIN@/api"
arg-order = ["command", "params", "json"]

[annotations]
open-world-hint = true

[input]
type = "object"
required = ["command"]

[input.properties.command]
type = "string"
description = "gws command arguments (e.g. 'calendar calendarList list', 'gmail users messages list', 'drive files list')"

[input.properties.params]
type = "string"
description = "JSON params string (e.g. '{\"userId\": \"me\", \"maxResults\": 5}')"

[input.properties.json]
type = "string"
description = "JSON request body, passed to gws as one --json argument so it may contain spaces (e.g. '{\"name\": \"A new title\"}' with command 'drive files update' and the file id in params)."
