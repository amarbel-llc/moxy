schema = 3
result-type = "text"
perms-request = "always-allow"
path-exempt = "name is a bare program name looked up on PATH, not a path; it only reports whether the program exists"
permit-async = false
description = "Locate a program on PATH by bare name. Returns the absolute path if found, exits nonzero if not. Names containing '/' or starting with '-' are refused."
command = "@BIN@/which"
arg-order = ["name"]

[input]
type = "object"
required = ["name"]

[input.properties.name]
type = "string"
description = "Binary name to locate (e.g. 'go', 'cargo', 'pivy-tool'). No '/', no leading '-'."

[annotations]
read-only-hint = true
idempotent-hint = true
