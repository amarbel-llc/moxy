schema = 3
result-type = "text"
perms-request = "dynamic"
permit-async = false
description = "Initialize a new flake in the specified directory."
command = "@BIN@/flake-init"
arg-order = ["template", "flake_dir"]

[input.properties.template]
type = "string"
description = "Template flake reference (e.g., 'templates#rust'). If not specified, uses default template."

[input.properties.flake_dir]
type = "string"
description = "Directory to initialize the flake in. Defaults to current directory. Judged like a folio write: the session worktree passes, anything else asks."

[annotations]
idempotent-hint = false

# moxy#519: the template is written into flake_dir, under the folio write
# policy. The template reference itself is not judged here.

[resources.flake_dir]
op = "write"

[dynamic-perms]
command = "@FOLIO_PERMS@"
args = ["write"]
arg-order = ["flake_dir"]
timeout-ms = 5000
