schema = 3
result-type = "text"
perms-request = "dynamic"
permit-async = false
description = "Initialize a new flake in the specified directory."
command = "@BIN@/flake-init"
arg-order = ["template", "flake_dir"]

[input.properties.template]
type = "string"
description = "Template flake reference. If not specified, uses the default template. A local one ('.' or '.#attr') is allowed; a registry name or remote reference (e.g., 'templates#rust', 'github:o/r') asks, since it fetches."

[input.properties.flake_dir]
type = "string"
description = "Directory to initialize the flake in. Defaults to current directory. Judged like a folio write: the session worktree passes, anything else asks."

[annotations]
idempotent-hint = false

# moxy#519: the template is written into flake_dir, under the folio write
# policy. moxy#522: the floor also asks for any template that is not absent or
# a local reference (".", ".#attr"): a registry name or a remote reference
# fetches. The broker is asked only about the directory.

[resources.flake_dir]
op = "write"

[dynamic-perms]
command = "@FOLIO_PERMS@"
args = ["flake-template"]
arg-order = ["flake_dir", "template"]
timeout-ms = 5000
