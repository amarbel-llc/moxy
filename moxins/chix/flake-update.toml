schema = 3
result-type = "text"
perms-request = "dynamic"
description = "Update flake.lock file. Args are passed to 'nix flake update' after a check (moxy#519): input names to update, and only a short list of flags that carry no path or code (--keep-going, --no-build, --all-systems, --show-trace, --print-build-logs, --verbose, --quiet, --refresh, --offline, --no-update-lock-file, --no-write-lock-file, --no-registries, --recreate-lock-file, --update-input NAME, -L, -v, -q); anything else (--flake, --override-input, a flake reference) is refused. Use flake_dir to pick the flake."
command = "@BIN@/flake-update"
arg-order = ["args", "flake_dir"]

[input.properties.args]
type = "array"
description = "Input names and allowed flags, passed to 'nix flake update' as single argv entries (no shell parsing). Example: ['nixpkgs'] to update only the 'nixpkgs' input of the flake in flake_dir."

[input.properties.args.items]
type = "string"

[input.properties.flake_dir]
type = "string"
description = "Directory to cd into before invoking nix; flake.lock is written there. Defaults to current directory. Judged like a folio write: the session worktree passes, anything else asks."

[annotations]
open-world-hint = true

# moxy#519: flake.lock is written in flake_dir, under the folio write policy.

[resources.flake_dir]
op = "write"

[dynamic-perms]
command = "@FOLIO_PERMS@"
args = ["write"]
arg-order = ["flake_dir"]
timeout-ms = 5000
