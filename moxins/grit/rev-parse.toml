schema = 3
result-type = "text"
perms-request = "always-allow"
permit-async = false
description = """Read-only `git rev-parse --verify`: resolve a ref to its full SHA, failing if it does not name an \
object. Has no write verb and no way to reach one, so a profile that must stay read-only can keep it. The \
mixed `grit.branch` tool (rev-parse beside the write verbs) is unchanged."""
command = "@BIN@/rev-parse"
arg-order = ["ref"]

[input]
type = "object"
required = ["ref"]

[input.properties.ref]
type = "string"
description = "The ref to resolve (must not start with '-')."

[annotations]
read-only-hint = true
idempotent-hint = true
open-world-hint = false
