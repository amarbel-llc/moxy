schema = 3
result-type = "text"
perms-request = "always-allow"
path-exempt = "paths are pathspecs inside the session's own repository (git refuses one outside it), not file reads (moxy#510)"
permit-async = false
description = """Read-only `git log` for the session's repository. Has no write verb and no way to reach one, \
so a profile that must stay read-only can keep it. The mixed `grit.branch` tool (log beside create, delete, \
reset, rebase and more) is unchanged."""
command = "@BIN@/log"
arg-order = ["ref", "paths", "max_count", "oneline"]

[input]
type = "object"

[input.properties.ref]
type = "string"
description = "Start ref or range (must not start with '-'; default HEAD)."

[input.properties.paths]
type = "array"
description = "Limit history to commits touching these paths."

[input.properties.paths.items]
type = "string"

[input.properties.max_count]
type = "integer"
description = "Maximum number of commits to show, git -n."

[input.properties.oneline]
type = "boolean"
description = "Compact one-line log format."

[annotations]
read-only-hint = true
idempotent-hint = true
open-world-hint = false
