schema = 3
result-type = "text"
perms-request = "always-allow"
path-exempt = "paths are pathspecs inside the session's own repository (git refuses one outside it), not file reads (moxy#510)"
permit-async = false
description = """Read-only `git status --short --branch` for the session's repository: working-tree and index state, \
with the branch and its upstream on the first line. Has no write verb and no way to reach one, so a \
profile that must stay read-only can keep it. The mixed `grit.stage` tool (status beside add, rm, mv) is unchanged."""
command = "@BIN@/status"
arg-order = ["untracked", "ignored", "paths"]

[input]
type = "object"

[input.properties.untracked]
type = "string"
enum = ["no", "normal", "all"]
description = "Untracked file mode: 'no', 'normal' (default), or 'all' (recurse into untracked dirs)."

[input.properties.ignored]
type = "boolean"
description = "Also show ignored files."

[input.properties.paths]
type = "array"
description = "Limit the report to these paths (relative to the repo root)."

[input.properties.paths.items]
type = "string"

[annotations]
read-only-hint = true
idempotent-hint = true
open-world-hint = false
