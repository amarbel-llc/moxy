schema = 3
substitute-result-uris = false
perms-request = "always-allow"
description = "Work with comments on a Google Doc. Subcommands: list (comment text, author, quoted content, resolved status, replies), reply (respond to a comment, e.g. one anchored in the Docs UI), resolve and reopen (optionally with a reply message)."
command = "@BIN@/comment"
arg-order = ["subcommand", "file_id", "comment_id", "content", "page_size"]

[annotations]
open-world-hint = true

[input]
type = "object"
required = ["subcommand", "file_id"]

[input.properties.subcommand]
type = "string"
enum = ["list", "reply", "resolve", "reopen"]
description = "list: list comments. reply: reply to comment_id with content. resolve / reopen: resolve or reopen comment_id, with content as an optional reply message."

[input.properties.file_id]
type = "string"
description = "The Drive file ID of the Google Doc"

[input.properties.comment_id]
type = "string"
description = "The comment ID (from list). Required by reply, resolve and reopen."

[input.properties.content]
type = "string"
description = "Reply text. Required by reply; optional for resolve and reopen."

[input.properties.page_size]
type = "string"
description = "list only: max comments to return (default: 100)"
