schema = 3
perms-request = "dynamic"
description = "Create a new Google Doc from markdown (GitHub-flavored: headings, emphasis, links, lists and task lists, tables, footnotes, block quotes, fenced code blocks rendered as shaded monospace blocks). A body too large for one Docs API call is written in several: if a later one fails, the new Doc holds what the earlier ones wrote, and the error says how many were. Returns the created file metadata including ID, plus `images` (a link to each placed image or diagram's full-size render, in order) and `warnings` when something could not be placed. PlantUML is supported and is the preferred way to put a diagram in a Doc: write a fenced ```plantuml code block (sequence, component, class, state, activity, gantt, …) and it is rendered and placed inline as a sharp image — do not paste diagram source as text or describe a diagram in prose when one would help. Local image files (PNG/JPEG/GIF/SVG, or .puml) referenced as ![alt](path) are embedded too when content_path or base_dir is given."
command = "@BIN@/create"
arg-order = ["title", "content", "base_dir", "content_path"]

# content_path and base_dir are read from disk and uploaded to Google, so they
# are read under the same policy as folio read (#490).

[resources.content_path]
op = "read"

[resources.base_dir]
op = "read"

[dynamic-perms]
command = "@FOLIO_PERMS@"
args = ["read"]
arg-order = ["content_path", "base_dir"]
timeout-ms = 5000

[annotations]
open-world-hint = true

[input]
type = "object"
required = ["title"]

[input.properties.title]
type = "string"
description = "Title for the new Google Doc"

[input.properties.content]
type = "string"
description = "Markdown content for the document; give this or content_path. Diagrams: a fenced code block with language `plantuml` (or `puml`) is replaced by the rendered diagram, e.g. ```plantuml / Alice -> Bob: hello / ``` (@startuml/@enduml are added when missing; a fence holding several @startuml…@enduml diagrams gives one image each). A PlantUML syntax error fails the call with PlantUML's message before anything is written. To show PlantUML source literally, use another fence language such as `text`."

[input.properties.content_path]
type = "string"
description = "Absolute path of a markdown file to use instead of content. Preferred for documents kept on disk: the text is not re-sent through the tool call, and local images and .puml files resolve relative to the file's directory without setting base_dir. Fenced `plantuml` blocks in the file are rendered the same way."

[input.properties.base_dir]
type = "string"
description = "Absolute directory that local image paths in content are relative to (defaults to the directory of content_path). Every ![alt](path) without a URI scheme is read from disk and placed in the Doc: .puml/.plantuml/.pu rendered by PlantUML, .svg rasterized, .png/.jpg/.jpeg/.gif as-is. An unreadable, unsupported or unrenderable file fails the call before anything is written. With neither base_dir nor content_path, a local image shows as the text [image: path] and the result carries a warning; so does a remote image Google cannot fetch. Images are shown at natural size (diagrams rendered at 2x for sharpness), shrunk to fit the page when larger; alt text is not carried over. Each placed local image is uploaded to the user's Drive and shared by link before it is placed; on success the file is kept and its link returned in the result's `images` array."
