schema = 3
substitute-result-uris = false
perms-request = "always-allow"
description = "Update an existing Google Doc with new markdown. Replaces the document body entirely, including its images. PlantUML is supported and is the preferred way to put a diagram in a Doc: write a fenced ```plantuml code block (sequence, component, class, state, activity, gantt, …) and it is rendered and placed inline as a sharp image — do not paste diagram source as text or describe a diagram in prose when one would help. Local image files (PNG/JPEG/GIF/SVG, or .puml) referenced as ![alt](path) are embedded too when content_path or base_dir is given."
command = "@BIN@/update"
arg-order = ["file_id", "content", "base_dir", "content_path"]

[annotations]
open-world-hint = true

[input]
type = "object"
required = ["file_id"]

[input.properties.file_id]
type = "string"
description = "The Drive file ID of the Google Doc to update"

[input.properties.content]
type = "string"
description = "Markdown content to replace the document body with; give this or content_path. Diagrams: a fenced code block with language `plantuml` (or `puml`) is replaced by the rendered diagram, e.g. ```plantuml / Alice -> Bob: hello / ``` (@startuml/@enduml are added when missing). A PlantUML syntax error fails the call with PlantUML's message before anything is uploaded. To show PlantUML source literally, use another fence language such as `text`."

[input.properties.content_path]
type = "string"
description = "Absolute path of a markdown file to use instead of content. Preferred for documents kept on disk: the text is not re-sent through the tool call, and local images and .puml files resolve relative to the file's directory without setting base_dir. Fenced `plantuml` blocks in the file are rendered the same way."

[input.properties.base_dir]
type = "string"
description = "Absolute directory that local image paths in content are relative to (defaults to the directory of content_path). When known, every ![alt](path) without a URI scheme is read from disk and placed in the Doc: .puml/.plantuml/.pu rendered by PlantUML, .svg rasterized, .png/.jpg/.jpeg/.gif as-is. An unreadable, unsupported or unrenderable file fails the call before anything is uploaded. With neither base_dir nor content_path, local image paths are passed through and show as broken placeholders. Images are shown at natural size (diagrams rendered at 2x for sharpness), shrunk to fit the page when larger; alt text is not carried over. Each placed image is uploaded to the user's Drive, shared by link for the moment Docs needs to fetch it, then deleted."
